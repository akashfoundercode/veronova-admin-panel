<style>/* RootsGoods Poultry — pilot. RootsGoods style: simple, stable, symmetric. */
:root{
  --lime:#9BBE0C; --green:#4E6B12; --green-dk:#3F5A0E; --green-pale:#ECF2D8; --green-soft:#F6F9EC;
  --brown:#7A4A1D; --brown-soft:#F7F1E8; --brown-chip:#F3EADF;
  --ink:#1E1C18; --ink2:#43403A; --ink3:#6E6A61; --ink4:#A29D91;
  --line:#E3E5DC; --line2:#EEF0E8; --paper:#F6F7F2;
  --warn:#B8791C; --warn-soft:#FAF0D8; --danger:#A93F2E; --danger-soft:#F8E7E3; --info:#3F6B7D; --info-soft:#E6EEF1;
  --r:6px; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Segoe UI',Selawik,'Open Sans','Noto Sans Kannada','Noto Sans Devanagari','Noto Sans Gurmukhi','Noto Sans Tamil','Noto Sans Telugu',system-ui,sans-serif;
  background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
html:not([lang="en"]) body{line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--green)} a:hover{color:var(--green-dk)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--ink3)}
.mono{font-family:var(--mono)}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.center{text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:14px;border:1.5px solid transparent;white-space:nowrap}
.btn-go{background:var(--lime);color:var(--ink);font-weight:700}
.btn-go:hover{background:#8FAF0A}
.btn-ghost{background:#fff;color:var(--ink2);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink4)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border-color:rgba(169,63,46,.25)}
.btn-soft{background:var(--green-pale);color:var(--green-dk)}
.btn-sm{min-height:36px;padding:7px 12px;font-size:13px}
.btn-block{width:100%}
.btn-lg{min-height:54px;font-size:15.5px}

/* chips & badges */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:4px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--green-pale);color:var(--green-dk)} .b-warn{background:var(--warn-soft);color:#8A5A12}
.b-danger{background:var(--danger-soft);color:var(--danger)} .b-info{background:var(--info-soft);color:var(--info)}
.b-neutral{background:var(--line2);color:var(--ink3)} .b-paid{background:var(--brown-chip);color:var(--brown)}
.grade{font-family:var(--mono);min-width:26px;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{padding:9px 14px;border-radius:4px;font-size:13.5px;font-weight:600;min-height:42px;background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.chip.on{background:var(--green-pale);color:var(--green-dk);border-color:var(--lime)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--ink2);display:flex;gap:8px}
.field>span i{font-style:normal;font-weight:400;color:var(--ink3);margin-left:auto}
.input{width:100%;min-height:48px;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;font-size:16px}
.input:focus{border-color:var(--lime);outline:none}
.input.big{min-height:58px;font-size:24px;font-weight:700;text-align:right;font-family:var(--mono)}
.form{display:grid;gap:14px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.grid4{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.checks input{width:18px;height:18px;accent-color:var(--green)}
.checks label:has(input:checked){border-color:var(--lime);background:var(--green-soft)}
.err{background:var(--danger-soft);color:var(--danger);padding:10px 13px;border-radius:var(--r);font-size:13.5px;text-align:center}

/* login */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;gap:22px}
.auth-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.auth-head img{width:150px;height:auto}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--ink3)}
.auth h1{font-size:25px;font-weight:800;letter-spacing:-.6px;line-height:1.2;max-width:18ch}
.auth-card{width:100%;max-width:420px;border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;display:grid;gap:12px}
.auth-card h2{font-size:18px;text-align:center}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lang{min-height:38px;padding:7px 12px;border-radius:4px;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--ink2)}
.lang.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.pilot-note{font-size:11.5px;color:var(--ink4);text-align:center;max-width:40ch}

/* shed phone */
.shed{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;background:var(--green-dk);color:#fff;overflow-y:auto}
.shed-in{width:min(400px,100%);margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.shed-in img{width:110px;margin-bottom:12px;filter:brightness(0) invert(1)}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:120px;margin-bottom:8px}
.prog i{height:4px;border-radius:2px;background:rgba(255,255,255,.25)} .prog i.on{background:var(--lime)}
.shed h3{font-size:22px;font-weight:800;letter-spacing:-.4px}
.shed .sub{font-size:13px;opacity:.85;max-width:32ch}
.shed .grp{width:100%;margin-top:16px;text-align:left}
.shed .grp b{display:block;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.75;margin-bottom:8px;text-align:center}
.farmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{min-height:48px;padding:8px 6px;border-radius:var(--r);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:700}
.tile:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:16px}
.who .tile{display:flex;flex-direction:column;align-items:center;gap:7px;min-height:104px;padding:14px 8px}
.who .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--green-dk);font-weight:700;font-size:15px}
.who small{font-size:11.5px;opacity:.8;font-weight:600}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6)} .dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.pad button{min-height:62px;border-radius:var(--r);font-size:24px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22)}
.pad button.fn{font-size:14px;background:transparent}
.shed .perr{font-size:13px;font-weight:600;color:#FFD9D2;min-height:22px;margin-top:12px}
.shed-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.shed-links button{min-height:42px;padding:9px 16px;border-radius:var(--r);font-size:13.5px;font-weight:600;color:#fff;border:1px solid rgba(255,255,255,.35);white-space:nowrap}

/* app shell */
.shell{min-height:100vh;display:flex}
.side{width:248px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:#fff}
.side-top{padding:18px 16px;text-align:center;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;gap:6px}
.side-top img{width:110px}
.side-top .org{font-size:14px;font-weight:700;margin-top:6px}
.side nav{flex:1;overflow-y:auto;padding:10px}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r);font-size:14px;font-weight:500;color:var(--ink2);text-align:left}
.nav:hover{background:var(--paper)}
.nav.on{background:var(--lime);color:var(--ink);font-weight:700}
.nav .pill{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.side-foot{padding:12px;border-top:1px solid var(--line2);display:grid;gap:8px}
.me{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:700;flex-shrink:0;background:var(--green)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{min-height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);z-index:20}
.top h1{font-size:16.5px;font-weight:700;letter-spacing:-.3px;flex:1;min-width:0}
.burger{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:var(--r);flex-direction:column;align-items:center;justify-content:center;gap:4px}
.burger i{width:16px;height:2px;background:var(--ink);border-radius:2px}
.page{width:100%;max-width:1180px;margin:0 auto;padding:18px 16px 48px;display:grid;gap:16px}
.page.narrow{max-width:560px}
.lead{font-size:13.5px;color:var(--ink3);text-align:center;max-width:66ch;margin:0 auto;text-wrap:pretty}
.scrim{display:none}

/* cards */
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;min-width:0}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.card-h h3::before{content:"";width:22px;height:8px;flex-shrink:0;background:
  radial-gradient(circle at 4px 4px,var(--lime) 3px,transparent 3.5px),
  radial-gradient(circle at 18px 4px,var(--lime) 3px,transparent 3.5px),
  linear-gradient(var(--brown),var(--brown)) 7px 3.25px/7px 1.5px no-repeat}
.card-h .acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.card-b{padding:16px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;text-align:center}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3)}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .s{font-size:12.5px;color:var(--ink3)}
.row2{display:grid;gap:16px;grid-template-columns:1fr 1fr;align-items:start}
.row21{display:grid;gap:16px;grid-template-columns:1.5fr 1fr;align-items:start}
.alert{display:flex;gap:12px;padding:13px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);align-items:flex-start;flex-wrap:wrap}
.alert+.alert{margin-top:10px}
.alert .t{font-size:13.5px;font-weight:700} .alert .d{font-size:13px;color:var(--ink2);margin-top:2px}
.alert>div{flex:1 1 200px;min-width:0}
.a-warn{background:var(--warn-soft);border-color:rgba(184,121,28,.3)} .a-danger{background:var(--danger-soft);border-color:rgba(169,63,46,.25)}
.a-ok{background:var(--green-pale);border-color:rgba(78,107,18,.22)}
.bar{margin-bottom:14px} .bar:last-child{margin-bottom:0}
.bar .k{display:flex;gap:7px;align-items:baseline;font-size:13.5px;margin-bottom:6px}
.bar .k b{font-weight:600} .bar .k span{margin-left:auto;font-family:var(--mono);font-weight:600}
.bar .tr{height:8px;background:var(--line2);border-radius:4px;overflow:hidden} .bar .tr i{display:block;height:100%;background:var(--green);border-radius:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:none} .kv span:first-child{color:var(--ink3)} .kv b{font-variant-numeric:tabular-nums}
.kv.total{border-top:1.5px solid var(--ink);border-bottom:none;font-size:16px;margin-top:4px}
.empty{padding:36px 18px;text-align:center} .empty b{display:block;font-size:15px;color:var(--ink2)} .empty span{font-size:13px;color:var(--ink3)}

/* tables → cards on mobile */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td .btn{margin:2px 0}
.tbl td .btn+.btn{margin-left:6px}
.tbl td:last-child:not(.n){white-space:normal;min-width:150px}

/* checklist */
.task{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:none}
.tick{width:46px;height:46px;border-radius:var(--r);border:2px solid var(--line);display:grid;place-items:center;font-size:19px;font-weight:800;color:#fff;flex-shrink:0;background:#fff}
.tick.on{background:var(--green);border-color:var(--green)}
.task .tt{font-size:15px;font-weight:600} .task.done .tt{text-decoration:line-through;color:var(--ink3)}

/* modal + toast */
#modal .scrim-m{position:fixed;inset:0;background:rgba(30,28,24,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
#modal .box{background:#fff;border-radius:8px;width:min(560px,100%);margin:auto 0;box-shadow:0 10px 40px rgba(30,28,24,.24)}
#modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
#modal .mh h2{font-size:17px;font-weight:800;flex:1} #modal .mh p{font-size:12.5px;color:var(--ink3)}
#modal .mb{padding:18px 20px;display:grid;gap:14px}
#modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#modal .mf .btn{flex:1;min-width:130px}
.x{width:38px;height:38px;border-radius:var(--r);border:1.5px solid var(--line);font-size:18px;flex-shrink:0}
.logincard{border:2px dashed var(--lime);border-radius:var(--r);padding:18px;text-align:center;background:var(--green-soft)}
.logincard .big{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:4px}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{padding:12px 20px;border-radius:6px;font-size:13.5px;font-weight:600;color:#fff;background:var(--ink);box-shadow:0 8px 30px rgba(30,28,24,.22);text-align:center}
.toast.good{background:var(--green-dk)} .toast.bad{background:var(--danger)}

@media (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:80;width:min(290px,86vw);transform:translateX(-100%);transition:transform .22s ease-out;box-shadow:0 10px 40px rgba(30,28,24,.2)}
  .shell.open .side{transform:none}
  .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(30,28,24,.45);z-index:79}
  .burger{display:flex}
  .top h1{text-align:center}
  .stats{grid-template-columns:1fr 1fr}
  .row2,.row21,.grid3,.grid4{grid-template-columns:1fr}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--line);border-radius:var(--r);margin:10px 12px;width:auto;padding:6px 0}
  .tbl td{border:none;padding:6px 14px;display:flex;gap:12px;align-items:center}
  .tbl td::before{content:attr(data-l);font-size:12px;font-weight:600;color:var(--ink3);width:40%;flex-shrink:0}
  .tbl td.n{text-align:left}
  .tbl td:first-child{font-weight:700;font-size:15px}
  #modal .scrim-m{padding:0;align-items:flex-end}
  #modal .box{border-radius:8px 8px 0 0;margin:0}
}

/* farmer shell — 4 bottom tabs */
.fshell{min-height:100vh;display:flex;flex-direction:column;padding-bottom:78px}
.ftop{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:60px}
.ftop img{height:28px;width:auto}
.ftop-t{flex:1;min-width:0;display:flex;flex-direction:column}
.ftop-t b{font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftop-t span{font-size:12px;color:var(--ink3)}
.fback{min-height:40px;padding:6px 10px;border-radius:var(--r);border:1.5px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.flang{min-height:38px;padding:5px 8px;border-radius:4px;border:1.5px solid var(--line);font-size:13px;font-weight:700;background:#fff;max-width:96px}
.fpage{gap:12px;padding-top:16px}
.ftabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.ftabs button{min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink3);position:relative}
.ftabs button.on{color:var(--ink);font-weight:800}
.ftabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--lime)}
.fic{position:relative;display:inline-flex}
.fic i{position:absolute;top:-6px;right:-12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:grid;place-items:center}
@media (min-width:700px){.ftabs{left:50%;right:auto;width:560px;transform:translateX(-50%);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0}}
.fstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fstrip div{border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;text-align:center}
.fstrip span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}
.fstrip b{font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.fhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);font-size:15px;font-weight:700}
.fhead i{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.fhead.t-red{background:var(--danger-soft)} .fhead.t-red i{background:var(--danger)}
.fhead.t-amber{background:var(--warn-soft)} .fhead.t-amber i{background:var(--warn)}
.fhead.t-green{background:var(--green-pale)} .fhead.t-green i{background:var(--green)}
.fitem{display:flex;gap:12px;align-items:center;padding:14px 14px 14px 18px;border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.fitem::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}
.fi{width:44px;height:44px;border-radius:var(--r);flex-shrink:0;display:grid;place-items:center}
.fx{flex:1;min-width:0}
.ft{font-size:15px;font-weight:700;line-height:1.3}
.fs{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.45}
.fitem .btn{flex-shrink:0;min-height:44px}
.t-red.fitem::before{background:var(--danger)} .t-red .fi{background:var(--danger-soft);color:var(--danger)}
.t-amber.fitem::before{background:var(--warn)} .t-amber .fi{background:var(--warn-soft);color:var(--warn)}
.t-green.fitem::before{background:var(--green)} .t-green .fi{background:var(--green-pale);color:var(--green)}
.fwell{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 12px}
.fwell span{width:96px;height:96px;border-radius:50%;background:var(--green-pale);color:var(--green);display:grid;place-items:center}
.fwell b{font-size:24px;font-weight:800;letter-spacing:-.5px}
.fwell p{font-size:14px;color:var(--ink2)}
.fbig{min-height:96px;border-radius:var(--r);background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;font-weight:800;width:100%}
.fgroup{font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3);margin-top:8px}
.frow{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r)}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.dot.t-red{background:var(--danger)} .dot.t-amber{background:var(--warn)} .dot.t-green{background:var(--green)}
.freply{display:flex;flex-direction:column;gap:8px;padding:16px 16px 16px 20px;border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.freply::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}
.freply.t-green::before{background:var(--green)} .freply.t-amber::before{background:var(--warn)}
.freply .ft{font-size:16px} .freply .fs{font-size:14px}
.fmeta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3)}
.flist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.flist button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line2);color:var(--green)}
.flist button:last-child{border-bottom:none}
.flist button:hover{background:var(--green-soft)}
.flist span{flex:1;font-size:15px;font-weight:600;color:var(--ink)}
.flist em{font-style:normal;color:var(--ink4);font-size:18px}

/* farmer pages: tables always read as cards in the phone-width column */
.fshell .tbl thead{display:none}
.fshell .tbl,.fshell .tbl tbody,.fshell .tbl tr,.fshell .tbl td{display:block;width:100%}
.fshell .tbl tr{border:1px solid var(--line);border-radius:var(--r);margin:10px 12px;width:auto;padding:6px 0}
.fshell .tbl td{border:none;padding:6px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;text-align:left}
.fshell .tbl td::before{content:attr(data-l);font-size:12px;font-weight:600;color:var(--ink3);width:40%;flex-shrink:0}
.fshell .tbl td:first-child{font-weight:700;font-size:15px}
.fshell .tbl td:last-child:not(.n){min-width:0}
.fshell .stats,.fshell .row2,.fshell .row21,.fshell .grid3,.fshell .grid4{grid-template-columns:1fr 1fr}
.fshell .row2,.fshell .row21{grid-template-columns:1fr}
.fshell .card-h .acts{margin-left:0;width:100%}
.fshell .card-h .acts .btn{flex:1}

/* photos */
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.padd,.pth,.pimg,.pmore{aspect-ratio:1;border-radius:var(--r);width:100%}
.padd{border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--green);cursor:pointer;position:relative;background:#fff}
.padd b{font-size:11.5px;color:var(--ink2)}
.padd:hover{border-color:var(--lime);background:var(--green-soft)}
.pth{position:relative;overflow:hidden;border:1px solid var(--line)}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(30,28,24,.72);color:#fff;font-size:16px;line-height:1}
.pimg{object-fit:cover;background:var(--line2);border:1px solid var(--line);cursor:zoom-in;display:block}
.pimg.pmiss{cursor:default}
.pmore{display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-weight:700;color:var(--ink3)}
.fbtns{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
.frow{flex-wrap:wrap}
.lightbox{position:fixed;inset:0;z-index:500;background:rgba(20,18,15,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;border-radius:6px}
.lightbox .x{position:absolute;top:12px;right:12px;background:#fff}
#modal .box.wide{width:min(760px,100%)}
/* maize certificate */
.cert{display:grid;gap:14px;border:2px solid var(--green);border-radius:var(--r);padding:18px}
.cert-h{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1.5px solid var(--green-pale)}
.cert-h img{height:40px;width:auto}
.cert-g{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3)}
.cert-g .badge{font-size:20px;padding:6px 12px}
.ctbl{width:100%;border-collapse:collapse;font-size:13.5px}
.ctbl th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);padding:8px;border-bottom:1px solid var(--line);background:var(--paper)}
.ctbl td{padding:9px 8px;border-bottom:1px solid var(--line2)}
.ctbl .n{text-align:right;white-space:nowrap}
@media (max-width:560px){.ctbl th:nth-child(3),.ctbl td:nth-child(3){display:none}}
@media print{
  body>*:not(#modal){display:none!important}
  #modal .scrim-m{position:static;background:none;padding:0;display:block}
